# hotspot-core
[package]
name = "hotspot-core"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
ipnet.workspace = true
serde_json = "1"
toml = "0.8"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "form"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.14", features = ["tokio", "service", "server", "http1"] }
tower-http = { version = "0.6", features = ["set-header"] }
